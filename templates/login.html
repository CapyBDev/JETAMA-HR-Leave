{% extends "base.html" %}
{% block title %}Login | J-Leave App{% endblock %}

{% block content %}

<style>

/* ===== BACKGROUND ===== */
body {
    background: url("{{ url_for('static', filename='DJI_0094.JPG') }}") no-repeat center center/cover;
    height: 100vh;
    overflow: hidden;
}

/* Overlay blur */
.bg-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(4px);
}

/* ===== TOP NAVBAR ===== */
.top-bar {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    background: linear-gradient(90deg, #b2f7ef, #3a86ff);
    border-radius: 50px;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.top-bar img {
    height: 40px;
}

.login-btn {
    background: #3a86ff;
    color: white;
    border-radius: 30px;
    padding: 8px 20px;
    font-weight: 600;
}

/* ===== LEFT CONTENT ===== */
.hero-text {
    color: white;
    margin-top: 180px;
}

.hero-title {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 2px;
}

.hero-box {
    margin-top: 20px;
    background: rgba(0, 255, 200, 0.3);
    padding: 20px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
    max-width: 400px;
}

/* ===== LOGIN CARD ===== */
.login-card {
    margin-top: 120px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 30px;
    color: white;
}

.logo-lg {
    width: 120px;
    margin-bottom: 10px;
}

.form-control {
    border-radius: 12px;
}

.btn-primary {
    border-radius: 12px;
    background: #3a86ff;
    border: none;
}

</style>

<div class="bg-overlay"></div>

<!-- ===== TOP BAR ===== -->
<div class="top-bar shadow">
    <div class="d-flex align-items-center gap-2">
        <img src="{{ url_for('static', filename='JETAMA SDN BHD LOGO (TRANSPARENT).png') }}">
        <span class="fw-bold text-dark">HR & ESG DEPARTMENT</span>
    </div>

    <div class="login-btn">LOG IN</div>
</div>

<div class="container-fluid">
    <div class="row">

        <!-- LEFT SIDE -->
        <div class="col-md-7 hero-text px-5">
            <div class="hero-title">
                HR MANAGEMENT<br> SYSTEM
            </div>

            <div class="hero-box">
                <h5>Revolutionizing the way<br> Businesses Manage Human Resources</h5>
            </div>
        </div>

        <!-- RIGHT SIDE LOGIN -->
        <div class="col-md-5 d-flex justify-content-center">
            <div class="login-card shadow-lg w-75">

                <div class="text-center">
                    <img src="{{ url_for('static', filename='JETAMA SDN BHD LOGO (TRANSPARENT).png') }}" class="logo-lg">
                    <h4>J-Leave</h4>
                    <small>Employee Leave Management</small>
                </div>

                <form method="post" class="mt-3">

                    <div class="mb-3">
                        <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                    </div>

                    <button class="btn btn-primary w-100 py-2">Sign In</button>
                </form>

                <div class="text-center mt-3 small">
                    © J-HR&ESG • All rights reserved
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
