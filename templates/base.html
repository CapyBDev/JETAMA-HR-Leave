<div class="d-flex">

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">

    <div class="logo mb-4">
      <strong>JETAMA</strong>
    </div>

    <a href="/home" class="menu-item">
      <i class="bi bi-grid"></i> Dashboard
    </a>

    <div class="menu-title">Leave</div>
    <a href="{{ url_for('user_dashboard') }}" class="menu-item">My Leave</a>
    <a href="{{ url_for('apply_leave') }}" class="menu-item">Apply Leave</a>

    <div class="menu-title">Claim</div>
    <a href="{{ url_for('claim_dashboard') }}" class="menu-item">My Claims</a>
    <a href="{{ url_for('submit_claim') }}" class="menu-item">Submit Claim</a>

  </div>


  <!-- ================= MAIN CONTENT ================= -->
  <div class="main-content w-100">

    <!-- ================= TOPBAR ================= -->
    <div class="topbar d-flex justify-content-between align-items-center">

      <!-- Search -->
      <input type="text" class="form-control w-25" placeholder="Search here...">

      <!-- RIGHT SIDE -->
      <div class="d-flex align-items-center gap-3">

        <!-- 🔔 NOTIFICATION -->
        <div class="dropdown">
          <i class="bi bi-bell fs-5" data-bs-toggle="dropdown"></i>

          <div class="dropdown-menu dropdown-menu-end p-3">
            <p>No new notifications</p>
          </div>
        </div>

        <!-- 🌙 DARK MODE -->
        <button onclick="toggleTheme()" class="btn btn-light btn-sm">
          🌙
        </button>

        <!-- 👤 PROFILE -->
        <div class="dropdown">
          <div data-bs-toggle="dropdown" style="cursor:pointer;">
            <i class="bi bi-person-circle fs-4"></i>
          </div>

          <ul class="dropdown-menu dropdown-menu-end">
            <li class="dropdown-item">
              {{ session.get('full_name') }}
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a href="{{ url_for('logout') }}" class="dropdown-item text-danger">
                Logout
              </a>
            </li>
          </ul>
        </div>

      </div>
    </div>

    <!-- PAGE CONTENT -->
    <div class="p-4">
      {% block content %}{% endblock %}
    </div>

  </div>

</div>
